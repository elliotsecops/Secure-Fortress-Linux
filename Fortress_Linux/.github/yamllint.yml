# YAML linting configuration for Fortress Linux

extends: default

rules:
  # Document structure
  document-start: disable
  document-end: disable

  # Line length
  line-length:
    max: 120
    level: warning

  # Indentation
  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false

  # Quotes
  quoted-strings:
    quote-type: double
    require: false

  # Comments
  comments:
    min-spaces-from-content: 1

  # Truthy values
  truthy:
    allowed-values: ['true', 'false', 'yes', 'no']

  # Empty values
  empty-values:
    forbid-in-block-mappings: true
    forbid-in-flow-mappings: true

  # Brackets
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1

  # Braces
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1

# File-specific rules
ignore: |
  *.yml
  *.yaml
  .github/workflows/*
  molecule/**/*.yml
  ansible/**/*.yml
  **/molecule.yml
  **/requirements.yml