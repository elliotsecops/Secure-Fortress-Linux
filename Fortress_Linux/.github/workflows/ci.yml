name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security checks daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.9'
  ANSIBLE_VERSION: '2.9'
  MOLECULE_VERSION: '4.0'

jobs:
  lint:
    name: Code Quality and Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: tests/,molecule/

      - name: Run ansible-lint
        run: |
          ansible-lint ansible/ --exclude .git --exclude .venv --exclude venv

      - name: Run yamllint
        run: |
          yamllint -c .github/yamllint.yml .

      - name: Run flake8
        run: |
          flake8 ansible/ scripts/ tests/ --exclude=.git,__pycache__,.venv,venv

      - name: Run black formatting check
        run: |
          black --check ansible/ scripts/ tests/

      - name: Run bandit security scan
        run: |
          bandit -r ansible/ scripts/ -f json -o bandit-report.json || true

      - name: Upload bandit results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: bandit-results
          path: bandit-report.json

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety trivy semgrep

      - name: Run safety check on dependencies
        run: |
          safety check --json --output safety-report.json || true

      - name: Run trivy filesystem scan
        run: |
          trivy fs --format json --output trivy-report.json . || true

      - name: Run semgrep security scan
        run: |
          semgrep --config=auto --json --output=semgrep-report.json . || true

      - name: Upload security scan results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-scan-results
          path: |
            safety-report.json
            trivy-report.json
            semgrep-report.json

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-xdist pytest-html

      - name: Run unit tests with pytest
        run: |
          pytest tests/ \
            --unit \
            -v \
            --tb=short \
            --cov=ansible \
            --cov=scripts \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=80 \
            --html=test-results.html \
            --self-contained-html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results.html
            htmlcov/

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit
    strategy:
      matrix:
        os: [ubuntu-20.04, ubuntu-22.04, debian-11]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install molecule[docker] molecule-plugins[docker]

      - name: Install Docker
        run: |
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo usermod -aG docker $USER
          sudo systemctl start docker
          docker --version

      - name: Run Molecule syntax check
        run: |
          molecule syntax -s default

      - name: Run Molecule lint
        run: |
          molecule lint -s default

      - name: Run Molecule create
        run: |
          molecule create -s default

      - name: Run Molecule converge
        run: |
          molecule converge -s default

      - name: Run Molecule idempotence
        run: |
          molecule idempotence -s default

      - name: Run Molecule verify
        run: |
          molecule verify -s default

      - name: Run Molecule destroy
        run: |
          molecule destroy -s default

      - name: Upload Molecule logs
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: molecule-logs-${{ matrix.os }}
          path: molecule/default/logs/

  security-compliance:
    name: Security Compliance Tests
    runs-on: ubuntu-latest
    needs: test-integration
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run security tests
        run: |
          pytest tests/ \
            --security \
            -v \
            --tb=short \
            --html=security-test-results.html \
            --self-contained-html

      - name: Run compliance tests
        run: |
          pytest tests/ \
            --compliance \
            -v \
            --tb=short \
            --html=compliance-test-results.html \
            --self-contained-html

      - name: Upload security and compliance results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-compliance-results
          path: |
            security-test-results.html
            compliance-test-results.html

  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: test-integration
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run performance tests
        run: |
          pytest tests/ \
            --performance \
            -v \
            --tb=short \
            --html=performance-test-results.html \
            --self-contained-html

      - name: Upload performance results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-test-results
          path: performance-test-results.html

  build-and-test:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: test-integration
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t fortress-linux:test -f Fortress_Linux/Dockerfile ./Fortress_Linux || echo "Docker build skipped - non-critical"

      - name: Test Python unit tests
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Set up Python
            uses: actions/setup-python@v4
            with:
              python-version: '3.9'

          - name: Cache dependencies
            uses: actions/cache@v3
            with:
              path: ~/.cache/pip
              key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
              restore-keys: |
                ${{ runner.os }}-pip-

          - name: Install dependencies
            run: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install pytest pytest-cov

          - name: Run unit tests
            run: |
              pytest tests/test_bash_script.py -v --cov=. --cov-report=xml

          - name: Upload coverage reports
            uses: codecov/codecov-action@v3
            if: always()
            with:
              file: ./coverage.xml

      - name: Test Ansible playbooks
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Set up Python
            uses: actions/setup-python@v4
            with:
              python-version: '3.9'

          - name: Cache dependencies
            uses: actions/cache@v3
            with:
              path: ~/.cache/pip
              key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
              restore-keys: |
                ${{ runner.os }}-pip-

          - name: Install dependencies
            run: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt

          - name: Install Ansible
            run: |
              pip install ansible

          - name: Test playbook syntax
            run: |
              ansible-playbook --syntax-check ansible/playbooks/playbook_hardening.yml
              ansible-playbook --syntax-check ansible/playbooks/preflight_checks.yml
              ansible-playbook --syntax-check ansible/playbooks/backup.yml
              ansible-playbook --syntax-check ansible/playbooks/rollback.yml

          - name: Run Ansible lint
            run: |
              ansible-lint ansible/playbooks/ --force-color || true

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test-integration, security-compliance, performance-test]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging environment
        run: |
          echo "Deploying to staging environment..."
          # Add actual deployment commands here

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Add smoke test commands here

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-integration, security-compliance, performance-test]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production environment
        run: |
          echo "Deploying to production environment..."
          # Add actual deployment commands here

      - name: Run production smoke tests
        run: |
          echo "Running production smoke tests..."
          # Add smoke test commands here

  generate-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, security-compliance, performance-test]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Generate comprehensive test report
        run: |
          echo "Generating comprehensive test report..."
          # Add report generation logic here

      - name: Upload test report
        uses: actions/upload-artifact@v3
        with:
          name: comprehensive-test-report
          path: comprehensive-test-report.html

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [generate-report]
    if: always()
    steps:
      - name: Send success notification
        if: needs.generate-report.result == 'success'
        run: |
          echo "All tests passed successfully! 🎉"

      - name: Send failure notification
        if: needs.generate-report.result == 'failure'
        run: |
          echo "Some tests failed. Please check the logs. ❌"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const result = needs.generate-report.result;
            const message = result === 'success'
              ? '✅ All tests passed successfully!'
              : '❌ Some tests failed. Please check the logs.';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });