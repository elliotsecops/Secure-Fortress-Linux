# Ansible Configuration File

[defaults]
# Inventory file location
inventory = ./ansible/inventory/development.ini

# Remote user
remote_user = admin

# SSH settings
host_key_checking = False

# Retry settings
retry_files_enabled = False
timeout = 30

# Parallel execution
forks = 10

# Fact gathering
gathering = smart
gather_facts = True

# Logging
log_path = ./logs/ansible.log

# Display settings
display_skipped_hosts = False
display_ok_hosts = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH connection settings
ssh_args = -o ForwardAgent=yes -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

[colors]
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = cyan
unreachable = red
ok = green
changed = yellow
diff_add = green
diff_remove = red
diff_lines = cyan
