# Minimal Environment Inventory
# Use for resource-constrained systems

[minimal]
minimal-server ansible_host=192.168.1.50 ansible_user=admin

[minimal:vars]
security_level=basic
auto_updates_enabled=false
backup_enabled=false
monitoring_enabled=false

# Security settings
firewall_enabled=true
auditd_enabled=false
ssh_hardening_enabled=true

# Minimal settings
system_hardening_enabled=true
system_hardening_upgrade_packages=false
system_hardening_backup=false
system_hardening_remove_unnecessary=false

# Disable resource-intensive features
fail2ban_enabled=false
wazuh_manager_ip=
