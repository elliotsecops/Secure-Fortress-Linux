# Development Environment Inventory
# Use this for development and testing systems

[development]
dev-server-01 ansible_host=192.168.1.100 ansible_user=dev
dev-server-02 ansible_host=192.168.1.101 ansible_user=dev

[development:vars]
security_level=medium
auto_updates_enabled=false
backup_enabled=false
monitoring_enabled=false
wazuh_manager_ip=

# Security settings
firewall_enabled=true
auditd_enabled=false
ssh_hardening_enabled=true

# Development-specific settings
system_hardening_enabled=true
system_hardening_upgrade_packages=false
system_hardening_backup=false
