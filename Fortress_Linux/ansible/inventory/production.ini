# Production Environment Inventory
# Use this for production systems

[webservers]
web-prod-01 ansible_host=10.0.1.10 ansible_user=admin
web-prod-02 ansible_host=10.0.1.11 ansible_user=admin

[databases]
db-prod-01 ansible_host=10.0.2.10 ansible_user=admin
db-prod-02 ansible_host=10.0.2.11 ansible_user=admin

[appservers]
app-prod-01 ansible_host=10.0.3.10 ansible_user=admin
app-prod-02 ansible_host=10.0.3.11 ansible_user=admin

[production:children]
webservers
databases
appservers

[production:vars]
security_level=critical
auto_updates_enabled=true
backup_enabled=true
monitoring_enabled=true
wazuh_manager_ip=10.0.0.100

# Security settings
firewall_enabled=true
auditd_enabled=true
ssh_hardening_enabled=true
fail2ban_enabled=true

# Production-specific settings
system_hardening_enabled=true
system_hardening_upgrade_packages=true
system_hardening_backup=true
system_hardening_remove_unnecessary=true

# SSH settings
ssh_permit_root_login=no
ssh_password_authentication=no
ssh_port=22

# Firewall settings
firewall_default_incoming_policy=deny
firewall_default_outgoing_policy=allow
firewall_rate_limiting=true
firewall_rate_limit_ssh=true

# Allowed ports
firewall_allowed_ports:
  - { port: 80, proto: tcp, comment: "HTTP" }
  - { port: 443, proto: tcp, comment: "HTTPS" }
  - { port: 22, proto: tcp, comment: "SSH" }
