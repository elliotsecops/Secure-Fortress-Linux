# Testing Environment Inventory
# Use this for QA and pre-production testing

[testing]
test-server-01 ansible_host=192.168.1.200 ansible_user=test
test-server-02 ansible_host=192.168.1.201 ansible_user=test

[test-servers:children]
testing

[testing:vars]
security_level=high
auto_updates_enabled=true
backup_enabled=true
monitoring_enabled=true
wazuh_manager_ip=192.168.1.250

# Security settings
firewall_enabled=true
auditd_enabled=true
ssh_hardening_enabled=true

# Testing-specific settings
system_hardening_enabled=true
system_hardening_upgrade_packages=true
system_hardening_backup=true
