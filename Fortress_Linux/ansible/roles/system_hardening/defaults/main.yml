---
# Default variables for system hardening role

# Enable/disable system hardening
system_hardening_enabled: true

# Package management
system_hardening_upgrade_packages: true
system_hardening_remove_unnecessary: true

# Security packages to install
system_hardening_security_packages:
  - ufw
  - fail2ban
  - auditd
  - libpwquality
  - unattended-upgrades

# Unnecessary packages to remove
system_hardening_unnecessary_packages:
  - avahi-daemon
  - cups
  - cups-browsed
  - nfs-server
  - rpcbind

# Services to disable
system_hardening_disabled_services:
  - avahi-daemon
  - cups
  - cups-browsed
  - nfs-server
  - rpcbind

# Services to enable
system_hardening_enabled_services:
  - ufw
  - auditd
  - fail2ban

# File paths
system_hardening_pwquality_file: /etc/security/pwquality.conf
system_hardening_common_password_file: /etc/pam.d/common-password
system_hardening_common_auth_file: /etc/pam.d/common-auth
system_hardening_sudoers_file: /etc/sudoers
system_hardening_limits_file: /etc/security/limits.conf
system_hardening_securetty_file: /etc/securetty
system_hardening_backup_dir: /etc/fortress-backups

# Backup settings
system_hardening_backup: true
system_hardening_backup_files:
  - /etc/ssh/sshd_config
  - /etc/security/pwquality.conf
  - /etc/pam.d/common-password
  - /etc/audit/auditd.conf
  - /etc/ufw/ufw.conf

# Shell settings
system_hardening_umask: 027
system_hardening_shell_timeout: 600

# Security aliases
system_hardening_aliases:
  cp: 'cp -i'
  mv: 'mv -i'
  rm: 'rm -i'
  ln: 'ln -i'

# File permissions
system_hardening_file_permissions:
  - { path: /etc/shadow, mode: '0640' }
  - { path: /etc/gshadow, mode: '0400' }
  - { path: /etc/passwd, mode: '0644' }
  - { path: /etc/group, mode: '0644' }
  - { path: /etc/ssh/sshd_config, mode: '0600' }

# Login definitions
system_hardening_login_defs:
  PASS_MAX_DAYS: 90
  PASS_MIN_DAYS: 1
  PASS_MAX_LEN: 14
  PASS_WARN_AGE: 7
  LOGIN_RETRIES: 5
  LOGIN_TIMEOUT: 60

# General sysctl settings
system_hardening_sysctl_settings:
  kernel.randomize_va_space: 2
  kernel.dmesg_restrict: 1
  kernel.kptr_restrict: 1
  kernel.perf_event_paranoid: 2
  kernel.yama.ptrace_scope: 1
  fs.suid_dumpable: 0

# Network security sysctl settings
system_hardening_network_sysctl_settings:
  - name: net.ipv4.conf.all.send_redirects
    value: 0
  - name: net.ipv4.conf.default.send_redirects
    value: 0
  - name: net.ipv4.conf.all.accept_source_route
    value: 0
  - name: net.ipv4.conf.default.accept_source_route
    value: 0
  - name: net.ipv4.conf.all.accept_redirects
    value: 0
  - name: net.ipv4.conf.default.accept_redirects
    value: 0
  - name: net.ipv4.conf.all.secure_redirects
    value: 0
  - name: net.ipv4.conf.default.secure_redirects
    value: 0
  - name: net.ipv4.conf.all.log_martians
    value: 1
  - name: net.ipv4.conf.default.log_martians
    value: 1
  - name: net.ipv4.conf.all.rp_filter
    value: 1
  - name: net.ipv4.conf.default.rp_filter
    value: 1

# TCP security sysctl settings
system_hardening_tcp_sysctl_settings:
  - name: net.ipv4.tcp_syncookies
    value: 1
  - name: net.ipv4.tcp_max_syn_backlog
    value: 8192
  - name: net.ipv4.tcp_synack_retries
    value: 2
  - name: net.ipv4.tcp_syn_retries
    value: 5
  - name: net.ipv4.tcp_fin_timeout
    value: 10
  - name: net.ipv4.tcp_keepalive_time
    value: 1200
  - name: net.ipv4.tcp_keepalive_probes
    value: 3
  - name: net.ipv4.tcp_keepalive_intvl
    value: 15
  - name: net.ipv4.tcp_max_orphans
    value: 65536
  - name: net.ipv4.tcp_max_tw_buckets
    value: 65536
  - name: net.ipv4.tcp_rmem
    value: '4096 65536 16777216'
  - name: net.ipv4.tcp_wmem
    value: '4096 65536 16777216'
  - name: net.ipv4.tcp_mem
    value: '65536 65536 65536'
  - name: net.ipv4.tcp_window_scaling
    value: 1
  - name: net.ipv4.tcp_timestamps
    value: 1
  - name: net.ipv4.tcp_sack
    value: 1
  - name: net.ipv4.tcp_fack
    value: 1
  - name: net.ipv4.tcp_dsack
    value: 1
  - name: net.ipv4.tcp_reordering
    value: 3
  - name: net.ipv4.tcp_ecn
    value: 0
  - name: net.ipv4.tcp_tw_reuse
    value: 1
  - name: net.ipv4.tcp_no_metrics_save
    value: 1
  - name: net.ipv4.tcp_moderate_rcvbuf
    value: 1
  - name: net.ipv4.tcp_slow_start_after_idle
    value: 0
  - name: net.ipv4.tcp_mtu_probing
    value: 1
  - name: net.ipv4.tcp_base_mss
    value: 512
  - name: net.ipv4.tcp_min_snd_mss
    value: 512
  - name: net.ipv4.tcp_workaround_signed_windows
    value: 1
  - name: net.ipv4.tcp_challenge_ack_limit
    value: 100
  - name: net.ipv4.tcp_invalid_ratelimit
    value: 500
  - name: net.ipv4.tcp_min_tso_segs
    value: 2
  - name: net.ipv4.tcp_congestion_control
    value: bbr
  - name: net.ipv4.tcp_allowed_congestion_control
    value: 'bbr cubic reno'
  - name: net.ipv4.tcp_low_latency
    value: 1
  - name: net.ipv4.tcp_autocorking
    value: 1

# ICMP security sysctl settings
system_hardening_icmp_sysctl_settings:
  - name: net.ipv4.icmp_echo_ignore_broadcasts
    value: 1
  - name: net.ipv4.icmp_ignore_bogus_error_responses
    value: 1
  - name: net.ipv4.icmp_ratelimit
    value: 100
  - name: net.ipv4.icmp_ratemask
    value: 88089

# Kernel security sysctl settings
system_hardening_kernel_sysctl_settings:
  - name: kernel.randomize_va_space
    value: 2
  - name: kernel.dmesg_restrict
    value: 1
  - name: kernel.kptr_restrict
    value: 1
  - name: kernel.perf_event_paranoid
    value: 2
  - name: kernel.yama.ptrace_scope
    value: 1
  - name: fs.suid_dumpable
    value: 0

# ARP security sysctl settings
system_hardening_arp_sysctl_settings:
  - name: net.ipv4.conf.all.arp_filter
    value: 1
  - name: net.ipv4.conf.default.arp_filter
    value: 1
  - name: net.ipv4.conf.all.arp_ignore
    value: 1
  - name: net.ipv4.conf.default.arp_ignore
    value: 1
  - name: net.ipv4.conf.all.arp_announce
    value: 2
  - name: net.ipv4.conf.default.arp_announce
    value: 2
  - name: net.ipv4.conf.all.arp_accept
    value: 0
  - name: net.ipv4.conf.default.arp_accept
    value: 0
  - name: net.ipv4.conf.all.proxy_arp
    value: 0
  - name: net.ipv4.conf.default.proxy_arp
    value: 0
  - name: net.ipv4.conf.all.share_media
    value: 0
  - name: net.ipv4.conf.default.share_media
    value: 0
  - name: net.ipv4.conf.all.medium_id
    value: 0
  - name: net.ipv4.conf.default.medium_id
    value: 0
  - name: net.ipv4.conf.all.bootp_relay
    value: 0
  - name: net.ipv4.conf.default.bootp_relay
    value: 0
