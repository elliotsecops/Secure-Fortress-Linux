---
# Main tasks for system hardening

- name: Include default variables
  include_vars: ../defaults/main.yml

- name: Include OS-specific variables
  include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_distribution | lower }}-{{ ansible_distribution_version | split('.')[0] }}.yml"
    - "{{ ansible_distribution | lower }}.yml"
    - "default.yml"

- name: Update package cache
  apt:
    update_cache: yes
  when: system_hardening_enabled and ansible_pkg_mgr == 'apt'

- name: Upgrade system packages
  package:
    name: "*"
    state: latest
  when: system_hardening_enabled and system_hardening_upgrade_packages

- name: Install security packages
  package:
    name: "{{ system_hardening_security_packages }}"
    state: present
  when: system_hardening_enabled

- name: Remove unnecessary packages
  package:
    name: "{{ system_hardening_unnecessary_packages }}"
    state: absent
  when: system_hardening_enabled and system_hardening_remove_unnecessary

- name: Configure sysctl settings
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: yes
    reload: yes
  with_dict: "{{ system_hardening_sysctl_settings }}"
  when: system_hardening_enabled
  notify: restart sysctl

- name: Configure login.defs
  lineinfile:
    path: /etc/login.defs
    regexp: '^{{ item.key }}'
    line: '{{ item.key }} {{ item.value }}'
    state: present
  with_dict: "{{ system_hardening_login_defs }}"
  when: system_hardening_enabled

- name: Configure password quality
  template:
    src: "pwquality.conf.j2"
    dest: "{{ system_hardening_pwquality_file }}"
    owner: root
    group: root
    mode: '0644'
  when: system_hardening_enabled

- name: Configure common password
  template:
    src: "common-password.j2"
    dest: "{{ system_hardening_common_password_file }}"
    owner: root
    group: root
    mode: '0644'
  when: system_hardening_enabled

- name: Configure common auth
  template:
    src: "common-auth.j2"
    dest: "{{ system_hardening_common_auth_file }}"
    owner: root
    group: root
    mode: '0644'
  when: system_hardening_enabled

- name: Configure sudoers
  template:
    src: "sudoers.j2"
    dest: "{{ system_hardening_sudoers_file }}"
    owner: root
    group: root
    mode: '0440'
  when: system_hardening_enabled

- name: Configure limits.conf
  template:
    src: "limits.conf.j2"
    dest: "{{ system_hardening_limits_file }}"
    owner: root
    group: root
    mode: '0644'
  when: system_hardening_enabled

- name: Configure securetty
  template:
    src: "securetty.j2"
    dest: "{{ system_hardening_securetty_file }}"
    owner: root
    group: root
    mode: '0644'
  when: system_hardening_enabled

- name: Configure sysctl.d directory
  file:
    path: /etc/sysctl.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: system_hardening_enabled

- name: Create sysctl configuration files
  template:
    src: "sysctl-{{ item }}.conf.j2"
    dest: "/etc/sysctl.d/{{ item }}.conf"
    owner: root
    group: root
    mode: '0644'
  with_items:
    - network
    - system
    - security
  when: system_hardening_enabled
  notify: restart sysctl

- name: Configure cron.allow
  template:
    src: "cron.allow.j2"
    dest: /etc/cron.allow
    owner: root
    group: root
    mode: '0600'
  when: system_hardening_enabled

- name: Configure at.allow
  template:
    src: "at.allow.j2"
    dest: /etc/at.allow
    owner: root
    group: root
    mode: '0600'
  when: system_hardening_enabled

- name: Remove cron.deny if exists
  file:
    path: /etc/cron.deny
    state: absent
  when: system_hardening_enabled

- name: Remove at.deny if exists
  file:
    path: /etc/at.deny
    state: absent
  when: system_hardening_enabled

- name: Configure host.conf
  template:
    src: "host.conf.j2"
    dest: /etc/host.conf
    owner: root
    group: root
    mode: '0644'
  when: system_hardening_enabled

- name: Configure nsswitch.conf
  template:
    src: "nsswitch.conf.j2"
    dest: /etc/nsswitch.conf
    owner: root
    group: root
    mode: '0644'
  when: system_hardening_enabled

- name: Configure issue.net
  template:
    src: "issue.net.j2"
    dest: /etc/issue.net
    owner: root
    group: root
    mode: '0644'
  when: system_hardening_enabled

- name: Configure issue
  template:
    src: "issue.j2"
    dest: /etc/issue
    owner: root
    group: root
    mode: '0644'
  when: system_hardening_enabled

- name: Configure motd
  template:
    src: "motd.j2"
    dest: /etc/motd
    owner: root
    group: root
    mode: '0644'
  when: system_hardening_enabled

- name: Set file permissions
  file:
    path: "{{ item.path }}"
    mode: "{{ item.mode }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
  with_items: "{{ system_hardening_file_permissions }}"
  when: system_hardening_enabled

- name: Create backup directory
  file:
    path: "{{ system_hardening_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0750'
  when: system_hardening_enabled and system_hardening_backup

- name: Backup important files
  copy:
    src: "{{ item }}"
    dest: "{{ system_hardening_backup_dir }}/{{ item | basename }}.bak-{{ ansible_date_time.iso8601 }}"
    remote_src: yes
  with_items: "{{ system_hardening_backup_files }}"
  when: system_hardening_enabled and system_hardening_backup
  ignore_errors: yes

- name: Disable services
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
  with_items: "{{ system_hardening_disabled_services }}"
  when: system_hardening_enabled

- name: Enable services
  systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
  with_items: "{{ system_hardening_enabled_services }}"
  when: system_hardening_enabled

- name: Configure umask
  lineinfile:
    path: /etc/profile
    regexp: '^umask'
    line: 'umask {{ system_hardening_umask }}'
    state: present
  when: system_hardening_enabled

- name: Configure shell timeout
  lineinfile:
    path: /etc/profile
    regexp: '^TMOUT'
    line: 'TMOUT={{ system_hardening_shell_timeout }}'
    state: present
  when: system_hardening_enabled

- name: Configure alias for security
  lineinfile:
    path: /etc/profile.d/security.sh
    line: 'alias {{ item.key }}="{{ item.value }}"'
    create: yes
    owner: root
    group: root
    mode: '0644'
  with_dict: "{{ system_hardening_aliases }}"
  when: system_hardening_enabled

- name: Disable core dumps
  lineinfile:
    path: /etc/security/limits.conf
    line: '* soft core 0'
    state: present
  when: system_hardening_enabled

- name: Configure network security sysctl settings
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: yes
  loop: "{{ system_hardening_network_sysctl_settings }}"
  when: system_hardening_enabled

- name: Configure TCP security sysctl settings
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: yes
  loop: "{{ system_hardening_tcp_sysctl_settings }}"
  when: system_hardening_enabled

- name: Configure ICMP security sysctl settings
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: yes
  loop: "{{ system_hardening_icmp_sysctl_settings }}"
  when: system_hardening_enabled

- name: Configure kernel security sysctl settings
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: yes
  loop: "{{ system_hardening_kernel_sysctl_settings }}"
  when: system_hardening_enabled

- name: Configure ARP security sysctl settings
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: yes
  loop: "{{ system_hardening_arp_sysctl_settings }}"
  when: system_hardening_enabled

- name: Display system hardening status
  debug:
    msg: |
      System hardening configuration completed.
      Status: {{ 'Enabled' if system_hardening_enabled else 'Disabled' }}
      Package upgrades: {{ system_hardening_upgrade_packages }}
      Security packages: {{ system_hardening_security_packages }}
      Sysctl settings: {{ system_hardening_sysctl_settings | length }}
      Login settings: {{ system_hardening_login_defs | length }}
  when: system_hardening_enabled
