    name: net.ipv4.tcp_adv_win_scale
    value: '2'
    state: present
    sysctl_set: yes
  when: system_hardening_enabled

- name: Configure net.ipv4.tcp_app_win
  sysctl:
    name: net.ipv4.tcp_app_win
    value: '31'
    state: present
    sysctl_set: yes
  when: system_hardening_enabled

- name: Configure net.ipv4.tcp_window_scaling
  sysctl:
    name: net.ipv4.tcp_window_scaling
    value: '1'
    state: present
    sysctl_set: yes
  when: system_hardening_enabled

- name: Configure net.ipv4.tcp_timestamps
  sysctl:
