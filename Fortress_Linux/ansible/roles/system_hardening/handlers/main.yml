---
# Handlers for system hardening role

- name: restart sysctl
  systemd:
    name: systemd-sysctl
    state: restarted
    enabled: yes

- name: reload sysctl
  command: sysctl -p
  register: sysctl_reload
  failed_when: sysctl_reload.rc != 0

- name: restart networking
  systemd:
    name: networking
    state: restarted
    enabled: yes

- name: restart network-manager
  systemd:
    name: NetworkManager
    state: restarted
    enabled: yes

- name: restart ssh
  systemd:
    name: ssh
    state: restarted
    enabled: yes

- name: restart auditd
