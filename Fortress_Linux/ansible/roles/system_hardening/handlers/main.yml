    state: restarted
    enabled: yes

- name: restart apparmor
  systemd:
    name: apparmor
    state: restarted
    enabled: yes

- name: reload apparmor
  command: apparmor_parser -r /etc/apparmor.d/*
  register: apparmor_reload
  failed_when: apparmor_reload.rc != 0

