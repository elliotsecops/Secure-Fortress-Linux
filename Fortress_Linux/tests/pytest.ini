[tool:pytest]
# Pytest configuration for Fortress Linux testing

# Test discovery and execution
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting
addopts =
    --verbose
    --tb=short
    --strict-markers
    --cov=ansible
    --cov=scripts
    --cov-report=html:htmlcov/
    --cov-report=term-missing
    --cov-fail-under=80
    --html=test-results.html
    --self-contained-html

# Minimum Python version
minversion = 7.0

# Test ordering
markers =
    security: marks tests as security-related tests
    compliance: marks tests as compliance-related tests
    performance: marks tests as performance-related tests
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    slow: marks tests as slow running tests

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::ResourceWarning

# Custom configuration
console_output_style = progress
junit_family = xunit2
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test timeout settings
timeout = 300
timeout_method = thread

# Parallel execution
numprocesses = auto
dist = load

# Coverage configuration
[coverage:run]
source = ansible,scripts,tests
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */.venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:

[coverage:html]
directory = htmlcov

# Bandit configuration (for security testing)
[bandit]
exclude_dirs = tests,venv,.venv,env
skips = B101,B601
tests = ansible,scripts