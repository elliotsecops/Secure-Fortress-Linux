---
- name: Prepare
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Update package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - python3
          - python3-pip
          - python3-dev
          - python3-setuptools
          - build-essential
          - curl
          - wget
          - git
          - sudo
          - systemd
          - systemd-sysv
        state: present

    - name: Install Python dependencies
      pip:
        name:
          - ansible
          - docker
          - testinfra
          - pytest
        state: present

    - name: Create system users for testing
      user:
        name: "{{ item }}"
        shell: /bin/bash
        create_home: yes
        state: present
      loop:
        - testuser
        - securityuser

    - name: Create test directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /tmp/fortress-test
        - /var/log/fortress-test
        - /etc/fortress-test

    - name: Set up test environment variables
      copy:
        content: |
          FORTRESS_TEST_ENV=true
          FORTRESS_LOG_LEVEL=DEBUG
          FORTRESS_SECURITY_LEVEL=high
        dest: /etc/fortress-test/environment
        mode: '0644'

    - name: Ensure systemd is running
      systemd:
        name: systemd
        state: started
        enabled: yes

    - name: Ensure time synchronization
      apt:
        name: systemd-timesyncd
        state: present
        enabled: yes

    - name: Start and enable systemd-timesyncd
      systemd:
        name: systemd-timesyncd
        state: started
        enabled: yes

    - name: Set up basic networking
      copy:
        content: |
          # Basic network configuration for testing
          127.0.0.1 localhost
          ::1 localhost
        dest: /etc/hosts
        mode: '0644'

    - name: Create test SSH directory
      file:
        path: /etc/ssh/test_config
        state: directory
        mode: '0755'

    - name: Set up test SSH configuration
      copy:
        content: |
          # Test SSH configuration
          Port 22
          Protocol 2
          HostKey /etc/ssh/ssh_host_rsa_key
          HostKey /etc/ssh/ssh_host_ecdsa_key
          HostKey /etc/ssh/ssh_host_ed25519_key
          SyslogFacility AUTHPRIV
          LogLevel INFO
          PermitRootLogin yes
          PasswordAuthentication yes
          ChallengeResponseAuthentication no
          UsePAM yes
          X11Forwarding yes
          PrintMotd no
          AcceptEnv LANG LC_*
          Subsystem sftp /usr/lib/openssh/sftp-server
        dest: /etc/ssh/test_config/sshd_config
        mode: '0600'

    - name: Generate SSH host keys for testing
      command: ssh-keygen -t rsa -f /etc/ssh/ssh_host_rsa_key -N ""
      args:
        creates: /etc/ssh/ssh_host_rsa_key

    - name: Generate SSH host keys for testing (ECDSA)
      command: ssh-keygen -t ecdsa -f /etc/ssh/ssh_host_ecdsa_key -N ""
      args:
        creates: /etc/ssh/ssh_host_ecdsa_key

    - name: Generate SSH host keys for testing (ED25519)
      command: ssh-keygen -t ed25519 -f /etc/ssh/ssh_host_ed25519_key -N ""
      args:
        creates: /etc/ssh/ssh_host_ed25519_key

    - name: Start SSH service for testing
      systemd:
        name: ssh
        state: started
        enabled: yes

    - name: Set up test user SSH keys
      user:
        name: testuser
        generate_ssh_key: yes
        ssh_key_bits: 2048
        ssh_key_file: .ssh/id_rsa

    - name: Create test firewall rules file
      copy:
        content: |
          # Test firewall rules
          *filter
          :INPUT ACCEPT [0:0]
          :FORWARD ACCEPT [0:0]
          :OUTPUT ACCEPT [0:0]
          COMMIT
        dest: /etc/iptables/test_rules.v4
        mode: '0644'

    - name: Create test audit rules
      copy:
        content: |
          # Test audit rules
          -w /etc/passwd -p wa -k identity
          -w /etc/group -p wa -k identity
          -w /etc/shadow -p wa -k identity
        dest: /etc/audit/rules.d/test.rules
        mode: '0640'

    - name: Start auditd service
      systemd:
        name: auditd
        state: started
        enabled: yes

    - name: Create test password policy
      copy:
        content: |
          # Test password policy
          minlen = 8
          minclass = 3
          dcredit = -1
          ucredit = -1
          lcredit = -1
          ocredit = -1
        dest: /etc/security/pwquality.conf.d/test.conf
        mode: '0644'

    - name: Create test log directory
      file:
        path: /var/log/test
        state: directory
        mode: '0755'

    - name: Create test log files
      copy:
        content: "Test log entry"
        dest: /var/log/test/test.log
        mode: '0644'

    - name: Set up test cron jobs
      copy:
        content: |
          # Test cron job
          * * * * * echo "Test cron job" >> /tmp/cron_test.log
        dest: /etc/cron.d/test_cron
        mode: '0644'

    - name: Start cron service
      systemd:
        name: cron
        state: started
        enabled: yes

    - name: Create test system services
      copy:
        content: |
          [Unit]
          Description=Test Service
          After=network.target

          [Service]
          Type=simple
          ExecStart=/bin/echo "Test service started"
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/test-service.service
        mode: '0644'

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Enable test service
      systemd:
        name: test-service
        enabled: yes

    - name: Create test configuration files
      copy:
        content: |
          # Test configuration
          debug = true
          log_level = info
          security_level = high
        dest: /etc/test-config.conf
        mode: '0644'

    - name: Set up test file permissions
      file:
        path: /etc/test-secure-file
        state: touch
        mode: '0600'

    - name: Create test user groups
      group:
        name: "{{ item }}"
        state: present
      loop:
        - testgroup
        - securitygroup

    - name: Add test users to groups
      user:
        name: testuser
        groups: testgroup,securitygroup
        append: yes

    - name: Create test sudo configuration
      copy:
        content: |
          # Test sudo configuration
          testuser ALL=(ALL) NOPASSWD:ALL
        dest: /etc/sudoers.d/testuser
        mode: '0440'

    - name: Display preparation completion
      debug:
        msg: "Test environment preparation completed successfully"