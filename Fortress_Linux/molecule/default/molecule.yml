---
# Molecule test configuration
# Used for testing Ansible roles in isolated Docker containers

dependency:
  name: galaxy
  enabled: false
  options:
    role-file: ../../ansible/requirements.yml
    requirements-file: ../../ansible/requirements.yml

driver:
  name: docker
  provider:
    name: docker

platforms:
  - name: ubuntu-18.04
    image: ubuntu:18.04
    command: /sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    tmpfs:
      - /tmp
      - /run
    capabilities:
      - SYS_ADMIN

  - name: ubuntu-20.04
    image: ubuntu:20.04
    command: /sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    tmpfs:
      - /tmp
      - /run
    capabilities:
      - SYS_ADMIN

  - name: ubuntu-22.04
    image: ubuntu:22.04
    command: /sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    tmpfs:
      - /tmp
      - /run
    capabilities:
      - SYS_ADMIN

  - name: debian-10
    image: debian:10
    command: /sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    tmpfs:
      - /tmp
      - /run
    capabilities:
      - SYS_ADMIN

  - name: debian-11
    image: debian:11
    command: /sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    tmpfs:
      - /tmp
      - /run
    capabilities:
      - SYS_ADMIN

provisioner:
  name: ansible
  inventory:
    host_vars:
      ubuntu-18.04:
        ansible_python_interpreter: /usr/bin/python3
      ubuntu-20.04:
        ansible_python_interpreter: /usr/bin/python3
      ubuntu-22.04:
        ansible_python_interpreter: /usr/bin/python3
      debian-10:
        ansible_python_interpreter: /usr/bin/python3
      debian-11:
        ansible_python_interpreter: /usr/bin/python3

  playbooks:
    converge: ../../ansible/playbooks/playbook_hardening.yml
    prepare: prepare.yml
    cleanup: cleanup.yml

  env:
    ANSIBLE_LIBRARY: ${ANSIBLE_LIBRARY:-/usr/share/ansible}
    ANSIBLE_ROLES_PATH: ${ANSIBLE_ROLES_PATH:-../../ansible/roles}
    ANSIBLE_COLLECTIONS_PATH: ${ANSIBLE_COLLECTIONS_PATH:-~/.ansible/collections}

scenario:
  name: default
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy

verifier:
  name: testinfra
  directory: ../../tests/
  additional_files_or_dirs:
    - ../../tests/test_molecule.py
    - ../../tests/test_integration.py
    - ../../tests/test_security.py
    - ../../tests/test_ansible_playbook.py

lint: ansible-lint
  options:
    exclude:
      - .cache/
      - .git/
      - .molecule/
      - .venv/
      - venv/
    force-color: true
    display_relative_path: true

create_sequence:
  - dependency
  - create

check_sequence:
  - dependency
  - cleanup
  - destroy
  - syntax
  - create
  - prepare
  - converge
  - idempotence
  - verify

converge_sequence:
  - dependency
  - create
  - prepare
    - converge

destroy_sequence:
  - dependency
  - cleanup
  - destroy
