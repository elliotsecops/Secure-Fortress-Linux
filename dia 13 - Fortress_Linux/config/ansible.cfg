[defaults]
# Inventory and connection settings
inventory = ./config/hosts
remote_user = ansible
host_key_checking = False
inventory_plugins = host_list, script, auto, ini, yaml, constructed
retry_files_enabled = False
retry_files_save_path = ~/.ansible-retry

# Logging and output
log_path = ./logs/deployment.log
bin_ansible_callbacks = True
stdout_callback = yaml
callbacks_enabled = timer, profile_tasks, profile_roles

# SSH and connection settings
timeout = 30
connect_timeout = 30
command_timeout = 30
forks = 20
gathering = smart
gather_facts = True

# Performance improvements
pipelining = True
fact_caching = jsonfile
fact_caching_connection = ./.facts_cache
fact_caching_timeout = 600

# Security settings
ask_vault_pass = True
vault_password_file = ~/.ansible/vault_password_file
host_pattern_mismatch = warning

# Output settings
stdout_callback = default
bin_ansible_callbacks = True
callback_whitelist = timer, profile_tasks

# Module and plugin paths
library = ~/.ansible/plugins/modules:/usr/share/ansible/plugins/modules
module_utils = ~/.ansible/plugins/module_utils:/usr/share/ansible/plugins/module_utils
filter_plugins = ~/.ansible/plugins/filter:/usr/share/ansible/plugins/filter
test_plugins = ~/.ansible/plugins/test:/usr/share/ansible/plugins/test
vars_plugins = ~/.ansible/plugins/vars:/usr/share/ansible/plugins/vars
lookup_plugins = ~/.ansible/plugins/lookup:/usr/share/ansible/plugins/lookup

# Collections settings
collections_paths = ~/.ansible/collections:/usr/share/ansible/collections
collections_on_ansible_version_mismatch = warning

# Jinja2 settings
jinja2_native = True
jinja2_extensions = jinja2.ext.do,jinja2.ext.i18n

[inventory]
enable_plugins = host_list, script, auto, ini, yaml, constructed

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no
pipelining = True
# Use the following for more secure connections; comment out ssh_args above and uncomment these:
# ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o UserKnownHostsFile=/dev/null
host_key_checking = False
timeout = 30
control_path = %(directory)s/%%h-%%p-%%r

[paramiko_connection]
host_key_auto_add = False
host_key_verify = False

[accelerate]
accelerate_port = 5099
accelerate_timeout = 30
accelerate_connect_timeout = 5.0
accelerate_daemon_timeout = 30