---
- name: Fortress Linux System Hardening
  hosts: all
  become: true
  vars:
    wazuh_manager_ip: "YOUR_WAZUH_MANAGER_IP"
    # Updated packages list with additional security tools
    packages:
      - ufw
      - fail2ban
      - unattended-upgrades
      - auditd
      - wazuh-agent
      - aide
      - debsums
      - rkhunter
      - clamav
      - needrestart

    # Security configurations
    ssh_port: 22
    admin_user: "{{ ansible_user | default('ansible_user') }}"
    # List of users to lock down system access
    authorized_users:
      - "{{ admin_user }}"
    
    # File integrity monitoring settings
    aide_config_file: /etc/aide/aide.conf

  tasks:
    - name: Update package cache
      apt:
        update_cache: yes
        force_apt_get: yes

    - name: Install required security packages
      apt:
        name: "{{ packages }}"
        state: present
        force_apt_get: yes
        install_recommends: no
      notify:
        - restart wazuh-agent

    # Configure SSH security beyond the bash script
    - name: Configure SSH for enhanced security
      block:
        - name: Change SSH port from default (if changed in script)
          lineinfile:
            path: /etc/ssh/sshd_config
            regexp: "^#?Port "
            line: "Port {{ ssh_port }}"
            backup: yes
          notify: restart ssh

        - name: Disable SSH root login
          lineinfile:
            path: /etc/ssh/sshd_config
            regexp: "^#?PermitRootLogin "
            line: "PermitRootLogin no"
            backup: yes
          notify: restart ssh

        - name: Disable SSH password authentication
          lineinfile:
            path: /etc/ssh/sshd_config
            regexp: "^#?PasswordAuthentication "
            line: "PasswordAuthentication no"
            backup: yes
          notify: restart ssh

        - name: Enable key-based authentication
          lineinfile:
            path: /etc/ssh/sshd_config
            regexp: "^#?PubkeyAuthentication "
            line: "PubkeyAuthentication yes"
            backup: yes
          notify: restart ssh

        - name: Set SSH login grace time
          lineinfile:
            path: /etc/ssh/sshd_config
            regexp: "^#?LoginGraceTime "
            line: "LoginGraceTime 60"
            backup: yes
          notify: restart ssh

        - name: Limit max authentication attempts
          lineinfile:
            path: /etc/ssh/sshd_config
            regexp: "^#?MaxAuthTries "
            line: "MaxAuthTries 3"
            backup: yes
          notify: restart ssh

        - name: Set SSH idle timeout interval
          lineinfile:
            path: /etc/ssh/sshd_config
            regexp: "^#?ClientAliveInterval "
            line: "ClientAliveInterval 300"
            backup: yes
          notify: restart ssh

        - name: Set SSH client alive count max
          lineinfile:
            path: /etc/ssh/sshd_config
            regexp: "^#?ClientAliveCountMax "
            line: "ClientAliveCountMax 2"
            backup: yes
          notify: restart ssh

      when: ansible_os_family == "Debian"

    # Configure fail2ban
    - name: Configure fail2ban for SSH protection
      block:
        - name: Ensure fail2ban SSH jail is configured
          copy:
            content: |
              [sshd]
              enabled = true
              port = {{ ssh_port }}
              filter = sshd
              logpath = /var/log/auth.log
              maxretry = 3
              bantime = 3600
              findtime = 600
            dest: /etc/fail2ban/jail.local
            owner: root
            group: root
            mode: 0644
          notify: restart fail2ban

        - name: Ensure fail2ban is enabled and running
          systemd:
            name: fail2ban
            enabled: yes
            state: started

    # Configure UFW firewall with more comprehensive rules
    - name: Configure UFW firewall rules
      block:
        - name: Set UFW default deny policy
          ufw:
            direction: incoming
            policy: deny
          notify: reload ufw

        - name: Set UFW default allow for outgoing
          ufw:
            direction: outgoing
            policy: allow
          notify: reload ufw

        - name: Allow SSH through UFW
          ufw:
            rule: allow
            port: "{{ ssh_port }}"
            proto: tcp
            comment: "Allow SSH"
          notify: reload ufw

        - name: Allow HTTP through UFW (if needed)
          ufw:
            rule: allow
            port: "80"
            proto: tcp
            comment: "Allow HTTP"
          notify: reload ufw
          when: enable_http | default(false)

        - name: Allow HTTPS through UFW (if needed)
          ufw:
            rule: allow
            port: "443"
            proto: tcp
            comment: "Allow HTTPS"
          notify: reload ufw
          when: enable_https | default(false)

        - name: Enable UFW
          ufw:
            state: enabled
          notify: reload ufw

    # Configure AIDE for file integrity monitoring
    - name: Initialize and configure AIDE
      block:
        - name: Initialize AIDE database (first run)
          shell: aideinit -y
          args:
            creates: /var/lib/aide/aide.db
          become: yes
          become_user: root

        - name: Ensure AIDE cron job exists for regular checks
          cron:
            name: "run_aide"
            minute: "0"
            hour: "5"
            job: "/usr/bin/aide --check"
            user: root
            cron_file: "aide_check"

    # Configure auditd rules
    - name: Configure auditd for comprehensive monitoring
      block:
        - name: Add additional audit rules
          lineinfile:
            path: /etc/audit/rules.d/fortress.rules
            line: "{{ item }}"
            create: yes
          with_items:
            - "-w /etc/passwd -p wa -k identity"
            - "-w /etc/shadow -p wa -k identity"
            - "-w /etc/group -p wa -k identity"
            - "-w /etc/gshadow -p wa -k identity"
            - "-w /etc/hosts -p wa -k network"
            - "-w /etc/network/interfaces -p wa -k network"
            - "-w /etc/sysconfig/ -p wa -k network"
            - "-w /etc/ssh/sshd_config -p wa -k ssh"
            - "-w /etc/ssh/ssh_config -p wa -k ssh"
            - "-w /etc/crontab -p wa -k cron"
            - "-w /etc/cron.allow -p wa -k cron"
            - "-w /etc/cron.deny -p wa -k cron"
            - "-w /etc/cron.d/ -p wa -k cron"
            - "-w /etc/cron.daily/ -p wa -k cron"
            - "-w /etc/cron.hourly/ -p wa -k cron"
            - "-w /etc/cron.monthly/ -p wa -k cron"
            - "-w /etc/cron.weekly/ -p wa -k cron"
            - "-w /etc/anacrontab -p wa -k cron"
            - "-w /var/spool/cron/crontabs/ -p wa -k cron"
            - "-a always,exit -F arch=b64 -S creat -S open -S openat -S truncate -S faccessat -F exit=-EACCES -k access"
            - "-a always,exit -F arch=b64 -S creat -S open -S openat -S truncate -S faccessat -F exit=-EPERM -k access"
          notify: restart auditd

        - name: Ensure auditd service is enabled and running
          systemd:
            name: auditd
            enabled: yes
            state: started

    # Configure Wazuh Agent
    - name: Configure Wazuh Agent
      template:
        src: "../templates/wazuh-agent-config.j2"
        dest: /var/ossec/etc/ossec.conf
        owner: root
        group: root
        mode: 0600  # More restrictive permissions
      notify:
        - restart wazuh-agent

    - name: Enable and start Wazuh agent
      systemd:
        name: wazuh-agent
        enabled: yes
        state: started

    # Configure unattended-upgrades with security focus
    - name: Configure unattended-upgrades for security patches only
      block:
        - name: Configure unattended-upgrades to only install security updates
          copy:
            content: |
              APT::Periodic::Update-Package-Lists "1";
              APT::Periodic::Unattended-Upgrade "1";
              APT::Periodic::AutocleanInterval "7";
              APT::Periodic::CleanInterval "7";
              APT::Unattended-Upgrade::Origins-Pattern {
                "origin=Debian,codename=${distro_codename},label=Debian-Security";
                "origin=Ubuntu,codename=${distro_codename}-security,label=Ubuntu";
                "origin=Ubuntu,codename=${distro_codename},label=Ubuntu";
              };
              APT::Unattended-Upgrade::Package-Blacklist {
              };
              APT::Unattended-Upgrade::Automatic-Reboot "false";
              APT::Unattended-Upgrade::Remove-Unused-Dependencies "true";
              APT::Unattended-Upgrade::Allowed-Origins {
                "${distro_id}:${distro_codename}-security";
              };
            dest: /etc/apt/apt.conf.d/50unattended-upgrades
            owner: root
            group: root
            mode: '0644'

        - name: Enable unattended-upgrades
          copy:
            content: |
              DPkg::Post-Invoke {"/bin/systemctl restart --no-block unattended-upgrades.service || true";};
            dest: /etc/apt/apt.conf.d/20auto-upgrades
            owner: root
            group: root
            mode: '0644'

    # Additional security hardening tasks
    - name: Secure shared memory
      mount:
        name: /dev/shm
        src: tmpfs
        fstype: tmpfs
        opts: defaults,nodev,nosuid,noexec
        state: mounted
      when: ansible_mounts | selectattr("mount", "equalto", "/dev/shm") | list | length > 0

    - name: Set up rkhunter for rootkit detection
      block:
        - name: Update rkhunter database
          shell: rkhunter --update && rkhunter --propupd
          args:
            creates: /var/lib/rkhunter/db/rkhunter.db
          notify: run rkhunter

    - name: Ensure system file permissions are correct
      block:
        - name: Secure /etc/passwd permissions
          file:
            path: /etc/passwd
            mode: 0644
            owner: root
            group: root

        - name: Secure /etc/shadow permissions
          file:
            path: /etc/shadow
            mode: 0640
            owner: root
            group: shadow

        - name: Secure /etc/group permissions
          file:
            path: /etc/group
            mode: 0644
            owner: root
            group: root

        - name: Secure /etc/gshadow permissions
          file:
            path: /etc/gshadow
            mode: 0640
            owner: root
            group: shadow

        - name: Secure /etc/hosts.allow permissions
          file:
            path: /etc/hosts.allow
            mode: 0644
            owner: root
            group: root

        - name: Secure /etc/hosts.deny permissions
          file:
            path: /etc/hosts.deny
            mode: 0644
            owner: root
            group: root

  handlers:
    - name: restart wazuh-agent
      systemd:
        name: wazuh-agent
        state: restarted

    - name: reload ufw
      command: ufw reload

    - name: restart ssh
      systemd:
        name: ssh
        state: restarted

    - name: restart fail2ban
      systemd:
        name: fail2ban
        state: restarted

    - name: restart auditd
      systemd:
        name: auditd
        state: restarted

    - name: run rkhunter
      shell: rkhunter --check --sk